syntax = "proto3";

// ============================================================================
// DIE LEITUNG DES FRAMEWORKS (handgeschrieben, für jede Anwendung gleich)
//
// Hülle, Dienst und Protokoll-Nachrichten. Die Domänen-Nachricht (Command, Event, Query, Antwort, Hinweis)
// reist als Nutzlast: ihr Typname + ihre Bytes, kodiert mit dem Proto DER ANWENDUNG (vom Codegen erzeugt, z. B.
// Domain.Leitung/domain.proto: nur die Domänen-DTOs). So kennt das Framework keinen Domänen-Typ, und jede Anwendung
// bringt ihre eigenen Nachrichten mit (docs/06, docs/07).
// ============================================================================


option csharp_namespace = "Cqrs.Leitung";

package cqrs;

// ============================================================================
// gRPC SERVICE
// ============================================================================

service CqrsClientService {
    rpc Connect(stream ClientMessage) returns (stream ServerMessage);
}

// ============================================================================
// CLIENT → SERVER (Upstream)
// ============================================================================

message ClientMessage {
    oneof message {
        CommandRequest command = 1;
        CapabilitiesRequest capabilities = 4;
        QueryRequest query = 5;
        TransientEventRequest transient_event = 7;
        QueryResponseFromClient query_answer = 8;
        FunktionenAnbieten funktionen_anbieten = 10;
        ArbeitsErgebnis arbeits_ergebnis = 11;
        ArbeitLebtMeldung arbeit_lebt = 12;
        LiesLog lies_log = 13;
    }
}

// Verlässliches Lesen (Plan Pub/Sub-Neustrukturierung §2.7): das Log ab einer Position, gefiltert auf das, was die Sitzung hören darf, nur bis
// zum Horizont der Vollständigkeit — wer ab „bis“ weiterliest, verpasst nichts. So führt ein Client eine Projektion bei sich, und ein Client,
// der wieder verbindet, liest nach, was er verpasst hat; der Push bleibt die Abkürzung. ab = 0: von Anfang an.
message LiesLog {
    string korrelation = 1;
    int64 ab = 2;
    int32 hoechstens = 3;
}

message CommandRequest {
    CommandEnvelopeDto envelope = 1;
}

// Der Handshake: der Client nennt seinen Vertrag (der Server nimmt die Befugnisse aus SEINER Tabelle, Vertrag ∩ Token) — ein Client ohne
// Vertrag nennt, was er hören, senden und fragen will (message_types), und was er beantwortet (handle_queries); wirksam ist auch dann nur,
// was das Token erlaubt. Was die Sitzung hört, meldet der Server beim Verteiler seines Knotens an (Plan Pub/Sub-Neustrukturierung §2.7).
message CapabilitiesRequest {
    repeated string message_types = 2;
    repeated string handle_queries = 4;
    // Akteur-Vertrag (docs/konzept-akteure.md §3): "ich bin Vertrag X" — der Server nimmt die Fähigkeiten aus der
    // generierten Tabelle statt aus der Selbstauskunft; der Hash erkennt einen Client, der gegen einen anderen Stand gebaut ist.
    string vertrag = 5;
    string vertrag_hash = 6;
}

message QueryRequest {
    string correlation_id = 1;
    Nutzlast payload = 2;
    // Read-your-writes (Plan Pub/Sub-Neustrukturierung §2.7): „mindestens S auf v“ je Stream, den der Client zuletzt beschrieben hat (Version aus
    // der Quittung). Der Reader wartet begrenzt, bis seine Projektion jeden so weit verarbeitet hat; reicht die Frist nicht, sagt die Antwort
    // noch_nicht. Die Streams zählen zu den gezeigten — ihr Stand kommt in deps mit, auch wenn ein Objekt nicht ins Ergebnis fällt.
    repeated StreamStand mindestens = 4;
}

message StreamStand {
    string stream = 1;
    int32 version = 2;
}

// ============================================================================
// SERVER → CLIENT (Downstream)
// ============================================================================

message ServerMessage {
    oneof message {
        EventNotification event = 1;
        ErrorResponse error = 5;
        CapabilitiesResponse capabilities_response = 6;
        QueryResponse query_response = 7;
        QueryForward query_forward = 10;
        ArbeitsAuftrag arbeits_auftrag = 11;
        Aktualisiert aktualisiert = 12;
        LogSeite log_seite = 13;
    }
}

// Eine Seite des Logs: die Einträge nach Position geordnet; bis = die Position, ab der weiterzulesen ist (alles bis dorthin ist gelesen oder
// gehört nicht zur Sitzung); voll = es folgt sofort mehr.
message LogSeite {
    string korrelation = 1;
    repeated LogEintrag eintraege = 2;
    int64 bis = 3;
    bool voll = 4;
}

message LogEintrag {
    int64 position = 1;
    EventEnvelopeDto envelope = 2;
}

// Eine Projektion hat Streams weiterverarbeitet, die Antworten dieser Sitzung zeigen (oder, bei Antworten ohne Ids, die Projektion selbst):
// diese Queries lohnen eine neue Frage. Zusammengefasst (höchstens alle 200 ms), verlierbar — wer verlässlich lesen will, liest ab Position.
message Aktualisiert {
    repeated Nutzlast queries = 1;
}

message EventNotification {
    EventEnvelopeDto envelope = 1;
}

message CapabilitiesResponse {
    string session_id = 1;
    repeated string allowed_commands = 2;
    repeated string subscribed_events = 3;
    repeated string supported_queries = 4;
    repeated string unknown_types = 6;
    repeated string handling_queries = 8;
    // Der angenommene Akteur-Vertrag (leer = keiner bzw. abgelehnt) und — bei abweichendem Hash — der Server-Hash.
    string vertrag = 9;
    string vertrag_hash = 10;
}

// deps = der Stand je gezeigter Id: bis zu welcher Version die Projektion den Stream verarbeitet hat (Version für den nächsten Command).
// noch_nicht = die Projektion hat in der Frist nicht jeden Stream aus mindestens verarbeitet; die Daten sind der Stand davor.
message QueryResponse {
    string correlation_id = 1;
    Nutzlast payload = 2;
    repeated AggregateMetaDto deps = 3;
    bool noch_nicht = 4;
}

message AggregateMetaDto {
    string id = 1;
    string aggregate_type = 2;
    int32 version = 3;
}

message QueryForward {
    string correlation_id = 1;
    Nutzlast payload = 2;
}

message TransientEventRequest {
    EventEnvelopeDto envelope = 1;
}

message QueryResponseFromClient {
    string correlation_id = 1;
    Nutzlast payload = 2;
    string error_code = 3;
    string error_message = 4;
}

// Funktionen draußen ausführen (Plan Pub/Sub-Neustrukturierung §2.2, §2.7: ITraegt): ein Client bietet Funktionen an, die er trägt; der Server
// holt für ihn Eingänge beim Vermittler (Pull, Slots = Gleichzeitigkeit, Lease), reicht sie weiter und hält die Antwort unter „Funktion, Eingang“
// fest — die erste gewinnt. Gesendet wird beim Funktions-Actor; der Client ist nur die Hand.
message FunktionenAnbieten {
    repeated FunktionsAngebot angebote = 1;
}

message FunktionsAngebot {
    // Einfacher Name der Funktions-Schnittstelle, z. B. "IBildaufbereitung".
    string funktion = 1;
    int32 slots = 2;
}

// Ein Eingang einer Funktion: der Schlüssel „Funktion, Eingang“ (vorgang), die Funktion, das Event und seine Herkunft; ab = so viele Ausgaben
// (Strom) sind schon festgehalten — ein neuer Träger lässt sie aus und macht beim nächsten Stück weiter. hinweis = der Eingang ist ein Hinweis aus
// dem Hinweis-Netz (Plan Pub/Sub-Neustrukturierung §2.9): höchstens einmal, nichts wird festgehalten — die Antwort kommt als Ganzes (auch ein Strom),
// ihre Commands und Hinweise sendet der Funktions-Actor; stream/version nennen den Eingang, aus dem der Hinweis hervorging.
message ArbeitsAuftrag {
    string vorgang = 1;
    string korrelation = 2;
    string funktion = 3;
    Nutzlast eingang = 4;
    string akteur = 5;
    string stream = 6;
    int32 version = 7;
    int64 zeit_utc = 8;
    int32 ab = 9;
    bool hinweis = 10;
}

// Eine Ausgabe in der Reihenfolge der Funktion: ein Command, ein Event oder ein Hinweis.
message FunktionsAusgabe {
    oneof art {
        Nutzlast command = 1;
        Nutzlast event = 2;
        Nutzlast hinweis = 3;
    }
}

// Die Antwort auf einen Eingang — ganz oder (Strom) in Stücken: ab = Stelle der ersten Ausgabe dieses Stücks, fertig = der Lauf ist vollständig.
// Nicht leeres fehler = die Funktion ist draußen gescheitert (zählt gegen die Wiederholungen des Eingangs).
message ArbeitsErgebnis {
    string vorgang = 1;
    repeated FunktionsAusgabe ausgaben = 2;
    int32 ab = 3;
    bool fertig = 4;
    string fehler = 5;
}

message ArbeitLebtMeldung {
    string vorgang = 1;
}

message ErrorResponse {
    string code = 1;
    string message = 2;
    string correlation_id = 3;
}

// ============================================================================
// NUTZLAST
// ============================================================================

// Eine Domänen-Nachricht auf der Leitung: typ = Proto-Name des DTO ohne „Dto“ (= einfacher Typname, z. B. "ErstelleDatensatz"),
// daten = die {typ}Dto-Message des Anwendungs-Protos, protobuf-kodiert.
message Nutzlast {
    string typ = 1;
    bytes daten = 2;
}

// ============================================================================
// ENVELOPE TYPES
// ============================================================================

message CommandEnvelopeDto {
    string command_id = 1;
    string aggregate_id = 2;
    string aggregate_type = 3;
    int32 expected_version = 4;
    int64 created_at_utc = 5;
    string correlation_id = 6;
    string user_id = 7;
    string origin_session_id = 8;

    // Die Domänen-Nachricht: Typname + Bytes (Proto der Anwendung, docs/06).
    Nutzlast payload = 20;
}

message EventEnvelopeDto {
    string event_id = 1;
    string aggregate_id = 2;
    string aggregate_type = 3;
    int32 aggregate_version = 4;
    int64 created_at_utc = 5;
    string causation_id = 6;
    string correlation_id = 7;
    string user_id = 8;
    int32 stream_head_version = 10;

    // Die Domänen-Nachricht: Typname + Bytes (Proto der Anwendung, docs/06).
    Nutzlast payload = 20;
}
