# ═══════════════════════════════════════════════════════════════════
# Echtes Multi-Node-Deployment: EIN Consul + Postgres + DREI
# gRPC-Cluster-Nodes (grpc1/2/3). (Der frühere LoadHarness-Verifikationsnode
# ist mit dem Projekt entfernt, Commit fb07f5e.)
#
# Alle Container liegen im selben Docker-Netz → erreichen sich über die
# Service-Namen (grpc1, consul, postgres, …). Der entscheidende Multi-Node-
# Wert ist `CQRS_RECHNER` = eigener Service-Name je Node: der Rechner im Pool
# der Umgebung (umgebungen/multinode) nennt ihn als Adresse — nur so können
# die anderen Member diesen Node über die Leitung erreichen.
#
# Start:      docker compose -f deploy-multinode/docker-compose.yml up -d --build
# Stoppen:    docker compose -f deploy-multinode/docker-compose.yml down -v
# ═══════════════════════════════════════════════════════════════════

name: cqrs-multinode

# Gemeinsame Cluster-Env aller Nodes (grpc1/2/3). Der Rechner (CQRS_RECHNER) steht je Node.
# Cluster__Rolle=Mitglied: alle laufen mit AutoCreate.None (kein Runtime-Lazy-Create) — der dedizierte
# `migrate`-Service (Role=migrator) legt das Marten-Schema vorher eager + lock-gesichert an.
x-cluster-env: &cluster-env
  # Alle Werte stehen in umgebungen/multinode/ (umgebung.json, graphen/) (docs/06 §6.5); je Node nur Rolle + Rechner.
  CQRS_UMGEBUNG: multinode
  Cluster__Rolle: Mitglied

# Gemeinsamer Build (Docker-Layer-Cache → effektiv einmal gebaut).
x-grpc-build: &grpc-build
  context: ..
  dockerfile: deploy-multinode/Dockerfile
  args:
    PROJECT: Host.Grpc
    ENTRY_DLL: Host.Grpc.dll

x-infra-deps: &infra-deps
  consul:
    condition: service_healthy
  postgres:
    condition: service_healthy

services:

  consul:
    image: hashicorp/consul:1.19
    command: agent -dev -client=0.0.0.0
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cqrs_events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ★ Dedizierter Schema-Migrator (Multi-Node-Cold-Start, docs/06-transport-multinode-betrieb.md §6.3): dasselbe Image,
  #   Cluster__Rolle=Migrator → legt ALLE Marten-Objekte (inkl. der sonst LAZY erzeugten Snapshot-Tabellen)
  #   eager + advisory-lock-gesichert an, dann exit 0 (kein Cluster-/Consul-Start, berührt nur Postgres).
  #   grpc1/2/3 (alle Role=member, AutoCreate.None) warten per service_completed_successfully → kein Cold-
  #   Start-CREATE-TABLE-Race mehr. Erster Saga-Lauf gegen frischen Cluster ist 20/20.
  migrate:
    build: *grpc-build
    image: cqrs-host-grpc:mn
    environment:
      <<: *cluster-env
      Cluster__Rolle: Migrator   # kein Knoten: läuft ohne eigenen Rechner im Pool
    restart: "no"
    depends_on: *infra-deps

  grpc1:
    image: cqrs-host-grpc:mn
    environment:
      <<: *cluster-env
      CQRS_RECHNER: grpc1   # die Bildaufbereitung läuft hier (umgebungen/multinode); die Quellen der App-Instanzen auf grpc1 trägt rechnerdienst-grpc1
    ports:
      - "127.0.0.1:5001:5001"   # nur grpc1 nach außen (h2c) — für optionale externe Checks
      - "127.0.0.1:5002:5002"   # Einblick-Port (HTTP/1.1): /health
    depends_on:
      <<: *infra-deps
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5001 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  grpc2:
    image: cqrs-host-grpc:mn
    environment:
      <<: *cluster-env
      CQRS_RECHNER: grpc2
    depends_on:
      <<: *infra-deps
      migrate:
        condition: service_completed_successfully

  grpc3:
    image: cqrs-host-grpc:mn
    environment:
      <<: *cluster-env
      CQRS_RECHNER: grpc3
    depends_on:
      <<: *infra-deps
      migrate:
        condition: service_completed_successfully

  # Der RECHNERDIENST des Rechners grpc1 (docs/10 E18): trägt die Quellen der App-Instanzen auf grpc1 (linie1: der Dateiwächter auf
  #   /data/input) und gibt über die Leitung hinein — an das Backend unter grpc1:5001, mit dem Token der Instanz. Kein Cluster, kein Marten.
  rechnerdienst-grpc1:
    build:
      context: ..
      dockerfile: deploy-multinode/Dockerfile
      args:
        PROJECT: Host.Rechner
        ENTRY_DLL: Host.Rechner.dll
    image: cqrs-host-rechner:mn
    environment:
      CQRS_UMGEBUNG: multinode
      CQRS_RECHNER: grpc1
    depends_on:
      grpc1:
        condition: service_healthy
