<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 800" width="1360" height="800" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11">
  <defs>
    <marker id="pf" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#444"/></marker>
    <marker id="pl" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2b6cb0"/></marker>
    <marker id="pr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dd6b20"/></marker>
    <marker id="pa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2f855a"/></marker>
    <marker id="ph" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#999"/></marker>
    <marker id="pq" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#805ad5"/></marker>
    <style>
      .t{font-weight:600;font-size:12.5px;fill:#1a1a1a}
      .s{fill:#555}
      .k{stroke:#8a8a8a;stroke-width:1}
      .p{fill:#fff;stroke:#555;stroke-width:1.2}
      .kopf{font-weight:700;font-size:13px;fill:#1a1a1a}
      .plus{font-weight:700;font-size:13px;fill:#2b6cb0}
      .dom{font-weight:700;font-size:11px;fill:#666;letter-spacing:.5px}
      .f{fill:none;stroke:#444;stroke-width:1.4}
      .l{fill:none;stroke:#2b6cb0;stroke-width:1.4;stroke-dasharray:2 3}
      .r{fill:none;stroke:#dd6b20;stroke-width:1.6;stroke-dasharray:7 4}
      .a{fill:none;stroke:#2f855a;stroke-width:1.6}
      .h{fill:none;stroke:#999;stroke-width:1.2;stroke-dasharray:5 4}
      .q{fill:none;stroke:#805ad5;stroke-width:1.1;stroke-dasharray:1 3}
      .btn{fill:#2b6cb0;font-weight:600}
    </style>
  </defs>
  <rect width="1360" height="800" fill="#fbfbf8"/>

  <!-- Spaltenköpfe -->
  <g>
    <rect x="10" y="10" width="200" height="52" rx="6" fill="#fff3d6" class="k"/>
    <text x="20" y="31" class="kopf">① Client-Ausgang</text><text x="190" y="31" class="plus" text-anchor="end">＋</text>
    <text x="20" y="50" class="s">was Akteure hineingeben (IDarf)</text>
    <rect x="230" y="10" width="190" height="52" rx="6" fill="#ececec" class="k"/>
    <text x="240" y="31" class="kopf">② Quellen</text><text x="410" y="31" class="plus" text-anchor="end">＋</text>
    <text x="240" y="50" class="s">Kopf eines Graphen, lauscht</text>
    <rect x="440" y="10" width="220" height="52" rx="6" fill="#e3ecff" class="k"/>
    <text x="450" y="31" class="kopf">③ Graphen</text><text x="650" y="31" class="plus" text-anchor="end">＋</text>
    <text x="450" y="50" class="s">rechnen vor dem Aggregat (Signatur)</text>
    <rect x="680" y="10" width="210" height="52" rx="6" fill="#ffe4d9" class="k"/>
    <text x="690" y="31" class="kopf">④ Aggregate</text><text x="880" y="31" class="plus" text-anchor="end">＋</text>
    <text x="690" y="50" class="s">entscheiden, schreiben das Log</text>
    <rect x="910" y="10" width="220" height="52" rx="6" fill="#dff3e7" class="k"/>
    <text x="920" y="31" class="kopf">⑤ Projektionen</text><text x="1120" y="31" class="plus" text-anchor="end">＋</text>
    <text x="920" y="50" class="s">Sichten je Store: Projektion + Reader</text>
    <rect x="1150" y="10" width="200" height="52" rx="6" fill="#fff3d6" class="k"/>
    <text x="1160" y="31" class="kopf">⑥ Client-Eingang</text><text x="1340" y="31" class="plus" text-anchor="end">＋</text>
    <text x="1160" y="50" class="s">was zu Akteuren kommt (IHoert)</text>
  </g>
  <text x="20" y="76" class="s" font-style="italic">Clients: Arbeitsplatz · KlassifikationsWorker · TrainingsWorker</text>
  <text x="1160" y="76" class="s" font-style="italic">(dieselben Akteure, Eingangsseite)</text>

  <!-- Domänen-Bänder über ②–⑤ -->
  <rect x="222" y="82" width="916" height="226" rx="10" fill="#eef4fb" stroke="#c9d8ea"/>
  <text transform="translate(234,250) rotate(-90)" class="dom">IMAGEPAIR</text>
  <rect x="222" y="318" width="916" height="186" rx="10" fill="#f3effa" stroke="#d9cfee"/>
  <text transform="translate(234,470) rotate(-90)" class="dom">DATENSATZ</text>
  <rect x="222" y="514" width="916" height="150" rx="10" fill="#eef7ef" stroke="#cfe5d2"/>
  <text transform="translate(234,650) rotate(-90)" class="dom">TRAININGSLAUF</text>

  <!-- ① Akteure (Ausgang) -->
  <rect x="20" y="100" width="180" height="90" rx="8" fill="#fffaf0" class="k"/>
  <text x="30" y="119" class="t">👤 Inspekteur</text>
  <text x="190" y="149" text-anchor="end">LabelBildPaar</text><circle cx="200" cy="145" r="4" class="p"/>
  <text x="190" y="172" text-anchor="end">SucheImagePairs ?</text><circle cx="200" cy="168" r="4" class="p"/>
  <text x="30" y="184" class="s">… 12 weitere</text>

  <rect x="20" y="250" width="180" height="72" rx="8" fill="#fffaf0" class="k"/>
  <text x="30" y="269" class="t">🤖 Klassifizierer</text>
  <text x="190" y="294" text-anchor="end">KlassifiziereBildPaarDurchKi</text><circle cx="200" cy="290" r="4" class="p"/>
  <text x="30" y="314" fill="#2f855a">↺ antwortet auf Arbeit ⚒</text>

  <rect x="20" y="540" width="180" height="72" rx="8" fill="#fffaf0" class="k"/>
  <text x="30" y="559" class="t">⚙ TrainingsSystem</text>
  <text x="190" y="584" text-anchor="end">MeldeTrainingAbgeschlossen</text><circle cx="200" cy="580" r="4" class="p"/>
  <text x="30" y="604" fill="#2f855a">↺ antwortet auf Arbeit ⚒</text>

  <!-- ② Quellen -->
  <rect x="240" y="104" width="170" height="96" rx="8" fill="#f6f6f6" class="k"/>
  <text x="250" y="122" class="t">⚡ Dateiwaechter</text>
  <text x="250" y="160" class="s">Kopf von Linienimport</text>
  <text x="400" y="144" text-anchor="end">DateiGefunden</text><circle cx="410" cy="140" r="4" class="p"/>
  <text x="250" y="176" class="s">Instanzen: linie-1, linie-2</text>
  <text x="250" y="192" class="s">für: KameraSystem</text>

  <!-- ③ Graphen -->
  <rect x="450" y="104" width="200" height="104" rx="8" fill="#f2f6ff" class="k"/>
  <text x="460" y="122" class="t">⬡ Linienimport</text>
  <circle cx="450" cy="140" r="4" class="p"/><text x="460" y="144">DateiGefunden</text>
  <text x="640" y="144" text-anchor="end">NimmBildAuf</text><circle cx="650" cy="140" r="4" class="p"/>
  <text x="640" y="169" text-anchor="end">✉ BildNichtLesbar</text><circle cx="650" cy="165" r="4" class="p"/>
  <text x="460" y="198" class="btn">⧉ Komposition öffnen</text>

  <rect x="450" y="342" width="200" height="120" rx="8" fill="#f2f6ff" class="k"/>
  <text x="460" y="360" class="t">⬡ Datensatzpflege</text>
  <circle cx="450" cy="375" r="4" class="p"/><text x="460" y="379">RangeAufzuloesen</text>
  <circle cx="450" cy="400" r="4" class="p"/><text x="460" y="404">EinfrierenAbzuschliessen</text>
  <text x="640" y="424" text-anchor="end">NimmRangeAuf</text><circle cx="650" cy="420" r="4" class="p"/>
  <text x="640" y="444" text-anchor="end">SchliesseEinfrierenAb</text><circle cx="650" cy="440" r="4" class="p"/>
  <text x="460" y="456" class="btn">⧉</text>

  <!-- ④ Aggregate -->
  <rect x="690" y="104" width="190" height="168" rx="8" fill="#fff4ef" class="k"/>
  <text x="700" y="122" class="t">▣ ImagePair</text>
  <circle cx="690" cy="140" r="4" class="p"/><text x="700" y="144">NimmBildAuf</text>
  <circle cx="690" cy="160" r="4" class="p"/><text x="700" y="164">LabelBildPaar</text>
  <circle cx="690" cy="180" r="4" class="p"/><text x="700" y="184">KlassifiziereBildPaar…</text>
  <text x="870" y="209" text-anchor="end">ImagePairErstellt</text><circle cx="880" cy="205" r="4" class="p"/>
  <text x="870" y="229" text-anchor="end">BildPaarGelabelt</text><circle cx="880" cy="225" r="4" class="p"/>
  <text x="870" y="254" text-anchor="end" fill="#2f855a">⚒ PaarZuBeurteilen</text><circle cx="880" cy="250" r="4" class="p"/>

  <rect x="690" y="342" width="190" height="140" rx="8" fill="#fff4ef" class="k"/>
  <text x="700" y="360" class="t">▣ Datensatz</text>
  <circle cx="690" cy="420" r="4" class="p"/>
  <text x="700" y="424">NimmRangeAuf</text>
  <circle cx="690" cy="440" r="4" class="p"/><text x="700" y="444">SchliesseEinfrierenAb</text>
  <text x="870" y="379" text-anchor="end">MitgliederAufgenommen</text><circle cx="880" cy="375" r="4" class="p"/>
  <text x="870" y="464" text-anchor="end" fill="#dd6b20">↺ RangeAufzuloesen</text><circle cx="880" cy="460" r="4" class="p"/>
  <text x="870" y="478" text-anchor="end" fill="#dd6b20">↺ EinfrierenAbzuschl.</text><circle cx="880" cy="474" r="4" class="p"/>

  <rect x="690" y="540" width="190" height="100" rx="8" fill="#fff4ef" class="k"/>
  <text x="700" y="558" class="t">▣ Trainingslauf</text>
  <circle cx="690" cy="580" r="4" class="p"/><text x="700" y="584">MeldeTraining…</text>
  <text x="870" y="609" text-anchor="end">TrainingAbgeschlossen</text><circle cx="880" cy="605" r="4" class="p"/>
  <text x="870" y="629" text-anchor="end" fill="#2f855a">⚒ TrainingZuRechnen</text><circle cx="880" cy="625" r="4" class="p"/>

  <!-- ⑤ Projektionen (je Store ein Rahmen) -->
  <rect x="915" y="98" width="210" height="186" rx="8" fill="none" stroke="#7fb894" stroke-dasharray="4 3"/>
  <text x="925" y="112" class="s">Store ImagePair</text>
  <rect x="925" y="118" width="190" height="56" rx="8" fill="#f2fbf5" class="k"/>
  <text x="935" y="136" class="t">⇶ ImagePairProjektion</text>
  <circle cx="925" cy="155" r="4" class="p"/><text x="935" y="159">Events (2)</text>
  <rect x="925" y="186" width="190" height="88" rx="8" fill="#f2fbf5" class="k"/>
  <text x="935" y="204" class="t">⌕ ImagePairReader</text>
  <circle cx="925" cy="222" r="4" class="p"/><text x="935" y="226">SucheImagePairs</text>
  <text x="1105" y="252" text-anchor="end">ImagePairListe</text><circle cx="1115" cy="248" r="4" class="p"/>
  <text x="935" y="268" class="s">… 6 weitere Queries</text>

  <rect x="915" y="336" width="210" height="150" rx="8" fill="none" stroke="#7fb894" stroke-dasharray="4 3"/>
  <text x="925" y="350" class="s">Store Datensatz</text>
  <rect x="925" y="356" width="190" height="48" rx="8" fill="#f2fbf5" class="k"/>
  <text x="935" y="374" class="t">⇶ DatensatzProjektion</text>
  <circle cx="925" cy="390" r="4" class="p"/><text x="935" y="394">Events</text>
  <rect x="925" y="414" width="190" height="62" rx="8" fill="#f2fbf5" class="k"/>
  <text x="935" y="432" class="t">⌕ DatensatzReader</text>
  <text x="935" y="452" class="s">Queries → Antworten</text>

  <rect x="915" y="534" width="210" height="116" rx="8" fill="none" stroke="#7fb894" stroke-dasharray="4 3"/>
  <text x="925" y="548" class="s">Store Trainingslauf</text>
  <rect x="925" y="554" width="190" height="40" rx="8" fill="#f2fbf5" class="k"/>
  <text x="935" y="572" class="t">⇶ TrainingslaufProjektion</text>
  <circle cx="925" cy="575" r="4" class="p"/>
  <rect x="925" y="602" width="190" height="38" rx="8" fill="#f2fbf5" class="k"/>
  <text x="935" y="625" class="t">⌕ TrainingslaufReader</text>

  <!-- ⑥ Akteure (Eingang) -->
  <rect x="1160" y="100" width="180" height="120" rx="8" fill="#fffaf0" class="k"/>
  <text x="1170" y="119" class="t">👤 Inspekteur</text>
  <circle cx="1160" cy="140" r="4" class="p"/><text x="1170" y="144">ImagePairErstellt</text>
  <circle cx="1160" cy="160" r="4" class="p"/><text x="1170" y="164">BildPaarGelabelt</text>
  <circle cx="1160" cy="185" r="4" class="p"/><text x="1170" y="189" fill="#2b6cb0">ImagePairListe (Antwort)</text>
  <circle cx="1160" cy="205" r="4" class="p"/><text x="1170" y="209" fill="#777">✉ BildNichtLesbar</text>

  <rect x="1160" y="258" width="180" height="56" rx="8" fill="#fffaf0" class="k"/>
  <text x="1170" y="277" class="t">🤖 Klassifizierer</text>
  <circle cx="1160" cy="296" r="4" class="p"/><text x="1170" y="300" fill="#2f855a">⚒ PaarZuBeurteilen</text>

  <rect x="1160" y="554" width="180" height="56" rx="8" fill="#fffaf0" class="k"/>
  <text x="1170" y="573" class="t">⚙ TrainingsSystem</text>
  <circle cx="1160" cy="592" r="4" class="p"/><text x="1170" y="596" fill="#2f855a">⚒ TrainingZuRechnen</text>

  <!-- Kanten: Schreibfluss -->
  <path class="f" d="M414,140 L446,140" marker-end="url(#pf)"/>
  <path class="f" d="M654,140 L686,140" marker-end="url(#pf)"/>
  <path class="f" d="M204,145 C214,145 214,90 230,90 L668,90 C680,90 676,160 686,160" marker-end="url(#pf)"/>
  <path class="f" d="M204,290 L664,290 C680,290 674,180 686,180" marker-end="url(#pf)"/>
  <path class="f" d="M654,420 L686,420" marker-end="url(#pf)"/>
  <path class="f" d="M654,440 L686,440" marker-end="url(#pf)"/>
  <path class="f" d="M884,205 C900,205 905,155 921,155" marker-end="url(#pf)"/>
  <path class="f" d="M884,225 C902,225 905,157 921,157"/>
  <path class="f" d="M884,375 C900,375 905,390 921,390" marker-end="url(#pf)"/>
  <path class="f" d="M204,580 L686,580" marker-end="url(#pf)"/>
  <path class="f" d="M884,605 C900,605 905,575 921,575" marker-end="url(#pf)"/>

  <!-- Kenntnis / Hinweis (verlierbar, an Akteure) -->
  <path class="h" d="M884,205 C896,205 898,292 912,292 L1132,292 C1146,292 1144,140 1156,140" marker-end="url(#ph)"/>
  <path class="h" d="M654,165 C668,165 664,300 680,300 L1136,300 C1150,300 1146,205 1156,205" marker-end="url(#ph)"/>

  <!-- Lesefluss -->
  <path class="l" d="M204,168 C216,168 218,86 234,86 L892,86 C906,86 902,222 921,222" marker-end="url(#pl)"/>
  <path class="l" d="M1119,248 C1140,248 1136,185 1156,185" marker-end="url(#pl)"/>

  <!-- Arbeit an Akteure -->
  <path class="a" d="M884,250 C896,250 898,282 910,282 L1138,282 C1150,282 1148,296 1156,296" marker-end="url(#pa)"/>
  <path class="a" d="M884,625 C900,625 902,656 916,656 L1136,656 C1150,656 1148,592 1156,592" marker-end="url(#pa)"/>

  <!-- Rücklauf: Command ohne Ziel aus dem Decide an einen Graph-Kopf -->
  <path class="r" d="M884,460 C898,460 900,494 886,494 L440,494 C428,494 430,375 446,375" marker-end="url(#pr)"/>
  <path class="r" d="M884,474 C894,474 894,499 882,499 L436,499 C422,499 426,400 446,400" marker-end="url(#pr)"/>

  <!-- liest (Lese-Fähigkeit einer Funktion) -->
  <path class="q" d="M600,342 L600,313 L1020,313 L1020,286" marker-end="url(#pq)"/>
  <text x="610" y="327" fill="#805ad5">liest ISearchImagePairs</text>

  <!-- Legende -->
  <g transform="translate(20,690)">
    <rect x="0" y="0" width="1320" height="96" rx="8" fill="#fff" class="k"/>
    <text x="14" y="22" class="t">Kanten</text>
    <path class="f" d="M14,42 L64,42" marker-end="url(#pf)"/><text x="72" y="46">Schreibfluss: Command → Graph/Aggregat, Event → Projektion</text>
    <path class="l" d="M14,64 L64,64" marker-end="url(#pl)"/><text x="72" y="68">Lesefluss: Query → Reader/Aggregat, Antwort → Akteur</text>
    <path class="h" d="M14,86 L64,86" marker-end="url(#ph)"/><text x="72" y="90">Kenntnis: Event oder Hinweis (✉) an Akteure, verlierbar</text>
    <path class="a" d="M470,42 L520,42" marker-end="url(#pa)"/><text x="528" y="46">Arbeit (⚒): Command ohne Ziel, den ein Akteur hört — seine Antwort kommt links (↺) zurück</text>
    <path class="r" d="M470,64 L520,64" marker-end="url(#pr)"/><text x="528" y="68">Rücklauf (↺): Command ohne Ziel aus dem Decide an den Kopf eines Graphen — unten durch die Gasse des Bandes</text>
    <path class="q" d="M470,86 L520,86" marker-end="url(#pq)"/><text x="528" y="90">liest: Lese-Fähigkeit einer Funktion am Store (keine Nachricht, nur Abhängigkeit)</text>
  </g>
</svg>
