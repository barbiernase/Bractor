syntax = "proto3";

option csharp_namespace = "ProtoRepo";

package CqrsSolution;

// ============================================================================
// gRPC SERVICE
// ============================================================================

service CqrsClientService {
    rpc Connect(stream ClientMessage) returns (stream ServerMessage);
}

// ============================================================================
// CLIENT → SERVER (Upstream)
// ============================================================================

message ClientMessage {
    oneof message {
        CommandRequest command = 1;
        SubscribeRequest subscribe = 2;
        UnsubscribeRequest unsubscribe = 3;
        CapabilitiesRequest capabilities = 4;
        QueryRequest query = 5;
        TriggerRequest trigger = 6;
        TransientEventRequest transient_event = 7;
        QueryResponseFromClient query_answer = 8;
        TriggerResult trigger_result = 9;
    }
}

message CommandRequest {
    CommandEnvelopeDto envelope = 1;
}

message SubscribeRequest {
    string event_type = 1;
    string aggregate_id = 2;
}

message UnsubscribeRequest {
    string event_type = 1;
    string aggregate_id = 2;
}

message CapabilitiesRequest {
    repeated string event_types = 1;
    repeated string message_types = 2;
    repeated string handle_triggers = 3;
    repeated string handle_queries = 4;
}

message QueryRequest {
    string correlation_id = 1;
    QueryPayloadDto payload = 2;
}

message TriggerRequest {
    TriggerPayloadDto payload = 1;
    string correlation_id = 2;
}

// ============================================================================
// SERVER → CLIENT (Downstream)
// ============================================================================

message ServerMessage {
    oneof message {
        EventNotification event = 1;
        SubscriptionConfirmed subscription_confirmed = 2;
        UnsubscriptionConfirmed unsubscription_confirmed = 3;
        CommandAccepted command_accepted = 4;
        ErrorResponse error = 5;
        CapabilitiesResponse capabilities_response = 6;
        QueryResponse query_response = 7;
        TriggerAck trigger_ack = 8;
        TriggerForward trigger_forward = 9;
        QueryForward query_forward = 10;
    }
}

message EventNotification {
    EventEnvelopeDto envelope = 1;
}

message SubscriptionConfirmed {
    string event_type = 1;
    string aggregate_id = 2;
}

message UnsubscriptionConfirmed {
    string event_type = 1;
    string aggregate_id = 2;
}

message CommandAccepted {
    string command_id = 1;
    string correlation_id = 2;
}

message CapabilitiesResponse {
    string session_id = 1;
    repeated string allowed_commands = 2;
    repeated string subscribed_events = 3;
    repeated string supported_queries = 4;
    repeated string allowed_triggers = 5;
    repeated string unknown_types = 6;
    repeated string handling_triggers = 7;
    repeated string handling_queries = 8;
}

message QueryResponse {
    string correlation_id = 1;
    QueryResponsePayloadDto payload = 2;
    repeated AggregateMetaDto deps = 3;
}

message AggregateMetaDto {
    string id = 1;
    string aggregate_type = 2;
    int32 version = 3;
}

message TriggerAck {
    bool accepted = 1;
    string correlation_id = 2;
    string error_message = 3;
}

message TriggerForward {
    TriggerPayloadDto payload = 1;
    string correlation_id = 2;
}

message QueryForward {
    string correlation_id = 1;
    QueryPayloadDto payload = 2;
}

message TransientEventRequest {
    EventEnvelopeDto envelope = 1;
}

message QueryResponseFromClient {
    string correlation_id = 1;
    QueryResponsePayloadDto payload = 2;
    string error_code = 3;
    string error_message = 4;
}

message TriggerResult {
    string correlation_id = 1;
    bool accepted = 2;
    string error_message = 3;
}

message ErrorResponse {
    string code = 1;
    string message = 2;
    string correlation_id = 3;
}

// ============================================================================
// ENVELOPE TYPES
// ============================================================================

message CommandEnvelopeDto {
    string command_id = 1;
    string aggregate_id = 2;
    string aggregate_type = 3;
    int32 expected_version = 4;
    int64 created_at_utc = 5;
    string correlation_id = 6;
    string user_id = 7;
    string origin_session_id = 8;

    oneof payload {
        EntfernePaarDto entferne_paar = 20;
        ErstelleDatensatzDto erstelle_datensatz = 21;
        FriereEinDto friere_ein = 22;
        FuegeRangeHinzuDto fuege_range_hinzu = 23;
        NimmPaarAufDto nimm_paar_auf = 24;
        NimmRangeAufDto nimm_range_auf = 25;
        SchliesseEinfrierenAbDto schliesse_einfrieren_ab = 26;
        SetzeSplitDto setze_split = 27;
        ErstelleImagePairDto erstelle_image_pair = 28;
        KlassifiziereBildPaarDurchKiDto klassifiziere_bild_paar_durch_ki = 29;
        KlassifiziereEinzelBildDurchKiDto klassifiziere_einzel_bild_durch_ki = 30;
        LabelBildPaarDto label_bild_paar = 31;
        LabelBildRegionDto label_bild_region = 32;
        LabelEinzelBildDto label_einzel_bild = 33;
        LabelPhysischesProduktDto label_physisches_produkt = 34;
        MarkiereAlsInspiziertDto markiere_als_inspiziert = 35;
        MeldeBildVerfuegbarDto melde_bild_verfuegbar = 36;
        BricheTrainingAbDto briche_training_ab = 37;
        MarkiereAlsHaengengebliebenDto markiere_als_haengengeblieben = 38;
        MeldeFortschrittDto melde_fortschritt = 39;
        MeldeTrainingAbgeschlossenDto melde_training_abgeschlossen = 40;
        MeldeTrainingBegonnenDto melde_training_begonnen = 41;
        MeldeTrainingGescheitertDto melde_training_gescheitert = 42;
        StarteTrainingDto starte_training = 43;

    }
}

message EventEnvelopeDto {
    string event_id = 1;
    string aggregate_id = 2;
    string aggregate_type = 3;
    int32 aggregate_version = 4;
    int64 created_at_utc = 5;
    string causation_id = 6;
    string correlation_id = 7;
    string user_id = 8;
    string target_subscriber_id = 9;
    int32 stream_head_version = 10;

    oneof payload {
        ImagePairInspiziertDto image_pair_inspiziert = 20;
        ImagePairKomplettDto image_pair_komplett = 21;
        PaarNichtKomplettDto paar_nicht_komplett = 22;
        TrainingAbgebrochenDto training_abgebrochen = 23;
        TrainingBegonnenDto training_begonnen = 24;
        TrainingHaengengebliebenDto training_haengengeblieben = 25;
        CommandFailedDto command_failed = 26;
        DatensatzBereitsEingefrorenDto datensatz_bereits_eingefroren = 27;
        DatensatzEingefrorenDto datensatz_eingefroren = 28;
        DatensatzErstelltDto datensatz_erstellt = 29;
        DatensatzExistiertBereitsDto datensatz_existiert_bereits = 30;
        DatensatzLeerDto datensatz_leer = 31;
        EinfrierenAngefordertDto einfrieren_angefordert = 32;
        PaarAufgenommenDto paar_aufgenommen = 33;
        PaareAufgenommenDto paare_aufgenommen = 34;
        PaarEntferntDto paar_entfernt = 35;
        RangeAngefordertDto range_angefordert = 36;
        RangeLeerDto range_leer = 37;
        SplitGesetztDto split_gesetzt = 38;
        SplitUngueltigDto split_ungueltig = 39;
        BildNichtVerfuegbarDto bild_nicht_verfuegbar = 40;
        BildPaarDurchKiKlassifiziertDto bild_paar_durch_ki_klassifiziert = 41;
        BildPaarGelabeltDto bild_paar_gelabelt = 42;
        BildRegionGelabeltDto bild_region_gelabelt = 43;
        BildVerfuegbarDto bild_verfuegbar = 44;
        BildVersionBereitsVerfuegbarDto bild_version_bereits_verfuegbar = 45;
        EinzelBildDurchKiKlassifiziertDto einzel_bild_durch_ki_klassifiziert = 46;
        EinzelBildGelabeltDto einzel_bild_gelabelt = 47;
        ImagePairEingabeUngueltigDto image_pair_eingabe_ungueltig = 48;
        ImagePairErstelltDto image_pair_erstellt = 49;
        ImagePairExistiertBereitsDto image_pair_existiert_bereits = 50;
        ImagePairNichtGefundenDto image_pair_nicht_gefunden = 51;
        PhysischesProduktGelabeltDto physisches_produkt_gelabelt = 52;
        RegionIndexUngueltigDto region_index_ungueltig = 53;
        RegionLabelsUngueltigDto region_labels_ungueltig = 54;
        TrainingAbgeschlossenDto training_abgeschlossen = 55;
        TrainingAngefordertDto training_angefordert = 56;
        TrainingBereitsBeendetDto training_bereits_beendet = 57;
        TrainingFortschrittDto training_fortschritt = 58;
        TrainingGescheitertDto training_gescheitert = 59;
        TrainingNichtAktivDto training_nicht_aktiv = 60;
        TrainingslaufExistiertBereitsDto trainingslauf_existiert_bereits = 61;
        TrainingslaufNichtGefundenDto trainingslauf_nicht_gefunden = 62;

    }
}

message QueryPayloadDto {
    oneof payload {
        GetImagePairStatistikDto get_image_pair_statistik = 20;
        GetProduktionsTageDto get_produktions_tage = 21;
        HoleDatensaetzeDto hole_datensaetze = 22;
        HoleTrainingslaeufeDto hole_trainingslaeufe = 23;
        GetImagePairDto get_image_pair = 24;
        GetImagePairHistorieDto get_image_pair_historie = 25;
        GetProduktionsStripDto get_produktions_strip = 26;
        GetProduktionsVerlaufDto get_produktions_verlauf = 27;
        GetUnklassifizierteImagePairsDto get_unklassifizierte_image_pairs = 28;
        HoleDatensatzDto hole_datensatz = 29;
        HoleDatensatzSamplesDto hole_datensatz_samples = 30;
        HoleTrainingslaufDto hole_trainingslauf = 31;
        SucheImagePairsDto suche_image_pairs = 32;

    }
}

message QueryResponsePayloadDto {
    oneof payload {
        DatensatzAntwortDto datensatz_antwort = 20;
        ImagePairAntwortDto image_pair_antwort = 21;
        TrainingslaufAntwortDto trainingslauf_antwort = 22;
        DatensatzListeDto datensatz_liste = 23;
        DatensatzNichtGefundenDto datensatz_nicht_gefunden = 24;
        DatensatzSamplesDto datensatz_samples = 25;
        ImagePairArbeitslisteDto image_pair_arbeitsliste = 26;
        ImagePairHistorieAntwortDto image_pair_historie_antwort = 27;
        ImagePairHistorieNichtGefundenDto image_pair_historie_nicht_gefunden = 28;
        ImagePairNichtGefundenAntwortDto image_pair_nicht_gefunden_antwort = 29;
        ImagePairStatistikAntwortDto image_pair_statistik_antwort = 30;
        ImagePairSuchergebnisDto image_pair_suchergebnis = 31;
        ProduktionsStripAntwortDto produktions_strip_antwort = 32;
        ProduktionsTageAntwortDto produktions_tage_antwort = 33;
        ProduktionsVerlaufAntwortDto produktions_verlauf_antwort = 34;
        TrainingslaufListeDto trainingslauf_liste = 35;
        TrainingslaufNichtGefundenAntwortDto trainingslauf_nicht_gefunden_antwort = 36;

    }
}

message TriggerPayloadDto {
    oneof payload {
        BenchPingDto bench_ping = 20;
        DateiErkanntDto datei_erkannt = 21;

    }
}

